<title>TRUE LINE Technician App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling column (max 640px), fixed bottom tab bar.
   Brand motif from the TRUE LINE site: a thin straight line ending in an amber dot. */
:root {
  --bg: #f2f6f7;
  --surface: #ffffff;
  --ink: #0d2832;
  --ink-soft: #4b6470;
  --line: #cfdce1;
  --flame: #1558d6;
  --flame-ink: #ffffff;
  --tip: #e8920c;
  --tip-ink: #7a4a00;
  --ok: #1c7c4a; --ok-bg: #e3f4ea;
  --bad: #b3261e; --bad-bg: #fdeceb;
  --info-bg: #e6eefc;
  --mute-bg: #e9eef0;
  --warn-bg: #fff4de; --warn-ink: #5c3a00; --warn-line: #f0c36b;
  --scrim: rgba(8, 21, 27, 0.55);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", "Noto Sans Malayalam", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1519; --surface: #112127; --ink: #e5eef1; --ink-soft: #93acb7; --line: #25404a;
    --flame: #5b9bff; --flame-ink: #06152e; --tip: #f5ab3a; --tip-ink: #f5ab3a;
    --ok: #5fd394; --ok-bg: #0f2a1c; --bad: #ff8f80; --bad-bg: #3a1512; --info-bg: #14284a; --mute-bg: #1a2f37;
    --warn-bg: #2b2108; --warn-ink: #f3d9a1; --warn-line: #6b5314; --scrim: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1519; --surface: #112127; --ink: #e5eef1; --ink-soft: #93acb7; --line: #25404a;
  --flame: #5b9bff; --flame-ink: #06152e; --tip: #f5ab3a; --tip-ink: #f5ab3a;
  --ok: #5fd394; --ok-bg: #0f2a1c; --bad: #ff8f80; --bad-bg: #3a1512; --info-bg: #14284a; --mute-bg: #1a2f37;
  --warn-bg: #2b2108; --warn-ink: #f3d9a1; --warn-line: #6b5314; --scrim: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--bg);
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--flame); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tip); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); }
.soft { color: var(--ink-soft); }
.small { font-size: 0.88rem; }
.ml { font-size: 0.88rem; color: var(--ink-soft); }
.label { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }

.app { max-width: 640px; margin-inline: auto; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
  border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.bar { max-width: 640px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; }
.brand { white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; letter-spacing: 0.04em; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand i { display: block; width: 22px; height: 3px; background: var(--flame); position: relative; flex: none; }
.brand i::after { content: ""; position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--tip); }
.brand small { font-family: var(--font-mono); font-weight: 400; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.hr { display: flex; align-items: center; gap: 8px; }
.save { white-space: nowrap; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
.save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.save.bad { color: var(--bad); }
.save.bad::before { background: var(--bad); }
.save.off::before { background: var(--tip); }
.iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1.5px solid var(--line); border-radius: 50%; color: var(--ink); cursor: pointer; }
.iconbtn svg { width: 22px; height: 22px; }

main { display: grid; gap: 16px; padding-block: 20px 8px; }
.rule { height: 2px; background: var(--line); position: relative; margin-block: 4px; }
.rule::after { content: ""; position: absolute; left: 0; top: -1px; width: 48px; height: 4px; background: var(--flame); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: 6px; border: 2px solid var(--flame); background: var(--flame); color: var(--flame-ink);
  font: 600 1rem var(--font-body); cursor: pointer; text-decoration: none; text-align: center;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.ghost { background: transparent; color: var(--flame); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.solid-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.block { width: 100%; }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 0.92rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.btnrow > * { flex: 1 1 150px; }
.linkbtn { background: none; border: 0; color: var(--flame); font-weight: 600; cursor: pointer; padding: 8px 0; text-align: left; min-height: 40px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.card.bad { background: var(--bad-bg); border-color: var(--bad); }
.card.ok { background: var(--ok-bg); border-color: var(--ok); }
.card h3 + .soft { margin-top: -6px; }
.ctitle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kv { display: grid; grid-template-columns: minmax(96px, 36%) 1fr; gap: 6px 12px; margin: 0; }
.kv dt { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); padding-top: 3px; }
.kv dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.sel { user-select: all; font-family: var(--font-mono); }

/* status chips */
.chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--mute-bg); color: var(--ink); white-space: nowrap; }
.chip[data-st="New"], .chip[data-st="Accepted"] { background: var(--info-bg); color: var(--flame); }
.chip[data-st="On the Way"], .chip[data-st="In Progress"] { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
.chip[data-st="Completed"] { background: var(--ok-bg); color: var(--ok); }
.chip[data-st="Cancelled"] { background: var(--mute-bg); color: var(--ink-soft); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }

/* stat strip */
.strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.strip > * { background: var(--surface); padding: 14px 16px; text-align: left; border: 0; display: grid; gap: 2px; align-content: start; min-width: 0; }
.strip button { cursor: pointer; }
.strip b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.strip.three { grid-template-columns: repeat(3, 1fr); }
.strip.three b { font-size: 1.3rem; }

/* job rows */
.jrow { display: grid; gap: 3px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; cursor: pointer; min-width: 0; }
.jrow:hover { border-color: var(--flame); }
.jtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.jrow b { font-size: 1.02rem; }
.list { display: grid; gap: 10px; }

/* forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lab { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
input[type="text"], input[type="tel"], input[type="number"], input[type="date"], input[type="time"], input[type="password"], input[type="search"], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; font: 400 1rem var(--font-body);
  color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px;
}
textarea { min-height: 92px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--tip); outline-offset: 1px; border-color: var(--flame); }
input[readonly] { opacity: 0.8; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.grid2 > * { min-width: 0; }
input[type="date"], input[type="time"] { min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; }
.check { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; cursor: pointer; padding: 6px 0; }
.check input { width: 24px; height: 24px; flex: none; margin: 1px 0 0; accent-color: var(--flame); }
.err { color: var(--bad); font-size: 0.9rem; }
.errbox { background: var(--bad-bg); border: 1px solid var(--bad); border-radius: 6px; padding: 12px 14px; color: var(--ink); }
.errbox ul { margin: 6px 0 0; padding-left: 1.2em; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow-x: auto; background: var(--surface); }
.seg button { flex: 1 0 auto; min-height: 44px; padding: 0 14px; background: transparent; border: 0; font-weight: 600; cursor: pointer; color: var(--ink-soft); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--flame); color: var(--flame-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 40px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 500; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--flame); border-color: var(--flame); color: var(--flame-ink); }
.stars { display: flex; gap: 4px; }
.stars button { width: 44px; height: 44px; font-size: 1.6rem; line-height: 1; background: transparent; border: 0; cursor: pointer; color: var(--line); }
.stars button[aria-pressed="true"] { color: var(--tip); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 400; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 600; }
pre.sum { margin: 0; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 400 0.84rem/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }

/* calculator */
.calc { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.calc > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.calc > div:last-child { border-bottom: 0; }
.calc .hi { background: var(--info-bg); font-weight: 600; }
.calc .sub { color: var(--ink-soft); }
.calc .neg { color: var(--bad); font-weight: 600; }

/* photos */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--mute-bg); padding: 0; cursor: pointer; }
.phb { width: 100%; height: 100%; border: 0; padding: 0; background: none; cursor: pointer; display: block; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .x { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; background: var(--scrim); color: #fff; border: 0; font-size: 1.1rem; line-height: 1; cursor: pointer; }
.addph { aspect-ratio: 1; border: 2px dashed var(--line); border-radius: 6px; display: grid; place-items: center; text-align: center; font-size: 0.82rem; color: var(--flame); font-weight: 600; cursor: pointer; padding: 6px; }
.addph svg { width: 24px; height: 24px; margin: 0 auto 2px; }
.addph.disabled { opacity: 0.45; pointer-events: none; }
.partimg { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); background: var(--mute-bg); flex: none; }
.prow { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; width: 100%; text-align: left; cursor: pointer; min-width: 0; }
.prow .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 40px; height: 40px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--bg); font-size: 1.2rem; cursor: pointer; }
.qty span { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }

/* guide */
details.g { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.g + details.g { margin-top: 10px; }
details.g > summary { cursor: pointer; padding: 14px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: center; min-height: 52px; }
details.g > summary::-webkit-details-marker { display: none; }
details.g > summary::after { content: "+"; font-family: var(--font-mono); font-size: 1.3rem; color: var(--flame); flex: none; }
details.g[open] > summary::after { content: "\2212"; }
details.g > .gb { padding: 0 16px 16px; display: grid; gap: 10px; }
.gb ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.gb h4 { margin: 6px 0 0; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
.stopbox { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); border-radius: 6px; padding: 10px 12px; }

/* bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs nav { max-width: 640px; margin-inline: auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.tabs button { display: grid; justify-items: center; gap: 2px; min-height: 56px; padding: 6px 2px; background: transparent; border: 0; border-radius: 8px; color: var(--ink-soft); font-size: 0.72rem; font-weight: 600; cursor: pointer; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--flame); background: var(--info-bg); }

/* overlays */
#overlay { position: fixed; inset: 0; z-index: 60; display: none; background: var(--scrim); align-items: flex-end; justify-content: center; }
#overlay.on { display: flex; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.sheet.mid { border-radius: 14px; margin: 16px; width: calc(100% - 32px); max-height: calc(100% - 32px); align-self: center; }
.sheet .sh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 8px; max-width: min(92vw, 520px); font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
.toast.bad { background: var(--bad); color: #fff; }

/* login */
.login { min-height: 100dvh; display: grid; align-content: center; gap: 18px; max-width: 420px; margin-inline: auto; padding-block: 32px; }
.login .burner { width: 84px; margin-bottom: 6px; }
.burner .ring { fill: none; stroke: var(--flame); stroke-width: 15; stroke-dasharray: 9 9.33; }
.burner .tips { fill: none; stroke: var(--tip); stroke-width: 3; stroke-dasharray: 3 15.33; stroke-dashoffset: -3; }
.burner .cap { fill: var(--surface); stroke: var(--ink-soft); stroke-width: 2; }
.burner .plate { fill: var(--surface); stroke: var(--line); stroke-width: 2; }

@media (max-width: 479px) { .brand small { display: none; } }
@media (min-width: 720px) {
  body { padding-bottom: 104px; }
  .strip.four { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 480px) {
  .strip { grid-template-columns: repeat(4, 1fr); }
  .strip.three { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation: none !important; } }
</style>

/* ============ commission calculator (company model) ============
   Balance = payment - actual spare cost
   Poster = 10% of balance, only if applicable
   Remaining = balance - poster
   Technician = 50% of remaining; Company = the other 50% */
function calcJob(payment, spare, poster, rates) {
  rates = rates || RATES;
  payment = num(payment); spare = num(spare);
  var balance = r2(payment - spare);
  var pos = (balance > 0 && poster) ? r2(balance * rates.poster) : 0;
  var rem = r2(Math.max(balance, 0) - pos);
  var tech = r2(rem * rates.tech);
  var company = r2(rem - tech);
  return { payment: payment, spare: spare, balance: balance, poster: pos, remaining: rem, tech: tech, company: company, shortfall: balance < 0 ? r2(-balance) : 0, posterApplied: !!poster, rates: { poster: rates.poster, tech: rates.tech } };
}

function rangeFor(key, id) {

  return { from: addDays(t, -13), to: t, label: 'Last 14 days' };
}
function statementData(id, rg) {
  var jobs = completedIn(db.jobs.filter(function (j) { return j.techId === id; }), rg.from, rg.to);
  if (rg.after) jobs = jobs.filter(function (j) { return j.completedAt > rg.after; });
  var led = ledgerOf(id).filter(function (e) { return (!rg.from || e.date >= rg.from) && e.date <= rg.to && (!rg.after || e.createdAt > rg.after); }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var t = totals(jobs);
  function s(type) { return sum(led.filter(function (e) { return e.type === type; }), function (e) { return e.amount; }); }
  var d = { jobs: jobs, led: led, t: t, adv: s('advance'), ded: s('deduction'), adj: s('adjustment'), pay: s('payout'), hand: s('handover') };
  d.net = r2(t.tech + d.adj - d.adv - d.ded - d.pay);
  return d;
}
var LEDGER_LABEL = { advance: 'Advance paid', deduction: 'Deduction', adjustment: 'Adjustment', payout: 'Settlement paid', handover: 'Cash handed to company' };
function statementText(id, rg, d) {

  L.push('JOBS COMPLETED: ' + d.t.count);
  d.jobs.forEach(function (j) { var c = jobCalc(j); L.push(fmtDate(j.report.completedDate) + '  ' + j.id + '  collected ' + inr(c.payment) + '  parts ' + inr(c.spare) + '  commission ' + inr(c.tech)); });
  L.push('', 'Collected: ' + inr(d.t.collected), 'Spare-parts cost: ' + inr(d.t.spare), 'Technician commission: ' + inr(d.t.tech), '');
  L.push('LEDGER');
  if (!d.led.length) L.push('No entries'); d.led.forEach(function (e) { L.push(fmtDate(e.date) + '  ' + LEDGER_LABEL[e.type] + '  ' + inr(e.amount) + '  Reason: ' + e.reason + (e.ref ? '  Ref: ' + e.ref : '')); });
  L.push('', 'Balance for this statement: ' + inr(d.net), 'Overall settlement balance (all time): ' + inr(balanceOf(id)), 'Cash collected and not yet handed over: ' + inr(cashHeld(id)));
  return L.join('\n');

  if (!isNum(amt) || num(amt) <= 0) return fail('en-err', 'Enter an amount above zero.');

  if ((type === 'deduction' || type === 'adjustment') && ref.length < 2) return fail('en-err', 'A deduction or adjustment needs a supporting record.');
  if (!date) return fail('en-err', 'Choose the date.');
  var a = num(amt); if (type === 'adjustment' && val('en-dir') === 'minus') a = -a;
  db.ledger.push({ id: 'E' + (db.counters.entry++), techId: el.dataset.id, type: type, amount: a, date: date, reason: reason, ref: ref, by: me().id, createdAt: new Date().toISOString() });
  if (!persist()) return; closeSheet(); toast('Entry saved'); render(true);
};
A.newexpense = function () { expenseSheet(); };
A.saveexpense = function () {
  var amt = val('ex-amt'), reason = val('ex-reason');
  if (!isNum(amt) || num(amt) <= 0) return fail('ex-err', 'Enter an amount above zero.');
  if (reason.length < 3) return fail('ex-err', 'Write what the expense was for.');
  db.expenses.push({ id: 'X' + uid(), date: val('ex-date') || todayStr(), amount: num(amt), reason: reason, ref: val('ex-ref'), by: me().id });
  if (!persist()) return; closeSheet(); toast('Expense saved'); render(true);
};

/* --- admin jobs & team --- */
A.newjob = function () { jobFormSheet(null); };
A.editjob = function () { jobFormSheet(curJob()); };
A.savejob = function (el) {
  var id = el.dataset.id, f = { custName: val('jf-name'), phone: val('jf-phone'), area: val('jf-area'), address: val('jf-addr'), mapsUrl: val('jf-map'), stoveType: val('jf-type'), brandModel: val('jf-model'), complaint: val('jf-comp'), date: val('jf-date'), time: val('jf-time'), techId: val('jf-tech'), poster: $('#jf-poster').checked };
  if (f.custName.length < 2) return fail('jf-err', 'Enter the customer name.');
  if (!/^(\+?91)?[6-9]\d{9}$/.test(f.phone.replace(/[\s-]/g, ''))) return fail('jf-err', 'Enter a valid 10-digit mobile number.');
  if (f.address.length < 3) return fail('jf-err', 'Enter the address.');
  if (f.mapsUrl && !/^https?:\/\//i.test(f.mapsUrl)) return fail('jf-err', 'The map link must start with https://');
  if (f.complaint.length < 3) return fail('jf-err', 'Enter the customer complaint.');
  if (!f.date || !f.time) return fail('jf-err', 'Choose the date and time.');
  if (id) { var j = jobById(id); Object.assign(j, f); logJ(j, 'Job details edited'); }
  else { var n = newJob(f); logJ(n, 'Job created' + (f.techId ? ' and assigned to ' + techName(f.techId) : '')); db.jobs.push(n); id = n.id; }
  if (!persist()) return; closeSheet(); toast('Job saved'); if (ui.view === 'job') render(true); else go('job', { id: id });
};
A.assign = function () { var j = curJob(), t = val('aj-tech'); j.techId = t; logJ(j, 'Assigned to ' + (t ? techName(t) : 'nobody')); persist(); toast('Assignment saved'); render(true); };
A.reopen = async function () {
  var j = curJob();
  if (!(await confirmBox({ title: j.status === 'Completed' ? 'Reopen this job?' : 'Reopen as New?', body: j.status === 'Completed' ? 'The job goes back to In Progress. Stock used is returned and the commission calculation is cleared until the job is completed again.' : 'The job goes back to New so it can be assigned again.', ok: 'Reopen' }))) return;
  if (j.status === 'Completed') { if (j.stockApplied) j.report.parts.forEach(function (l) { var p = partByCode(l.code); if (p && p.stock != null) p.stock += l.qty; }); j.stockApplied = false; j.calc = null; j.completedAt = ''; setStatus(j, 'In Progress', 'reopened by admin'); }
  else { j.safetyStop = false; j.cancelReason = ''; setStatus(j, 'New', 'reopened by admin'); }
  render(true);
};
A.rework = function () {
  var o = curJob(), n = newJob({ custName: o.custName, phone: o.phone, area: o.area, address: o.address, mapsUrl: o.mapsUrl, stoveType: o.stoveType, brandModel: o.brandModel, complaint: 'REWORK of ' + o.id + ': ' + (o.report.followUpNote || o.complaint), techId: o.techId, reworkOf: o.id });
  logJ(n, 'Rework job created from ' + o.id); db.jobs.push(n); persist(); toast('Rework job ' + n.id + ' created'); go('job', { id: n.id });
};
A.newtech = function () { techSheet(null); };
A.edittech = function (el) { techSheet(el.dataset.id); };
A.savetech = function (el) {
  var id = el.dataset.id, name = val('tf-name'), mob = val('tf-mob').replace(/[\s-]/g, ''), area = val('tf-area'), pin = val('tf-pin');
  if (name.length < 2) return fail('tf-err', 'Enter the technician’s name.');
  if (!/^[6-9]\d{9}$/.test(mob)) return fail('tf-err', 'Enter a valid 10-digit mobile number.');
  if (!/^\d{4}$/.test(pin)) return fail('tf-err', 'The PIN must be 4 digits.');
  if (id) { var u = userById(id); u.name = name; u.mobile = mob; u.area = area; u.pin = pin; }
  else {
    var n = 1 + Math.max(0, Math.max.apply(null, db.users.map(function (x) { var m = /^TL-T(\d+)$/.exec(x.id); return m ? +m[1] : 0; })));
    db.users.push({ id: 'TL-T' + pad(n), role: 'tech', name: name, mobile: mob, area: area, pin: pin, active: true, demo: false });
  }
  if (!persist()) return; closeSheet(); toast('Technician saved'); render(true);
};
A.toggletech = async function (el) {
  var u = userById(el.dataset.id), open = openJobsOf(myJobs(u.id)).length;
  var body = u.active ? (open ? u.name + ' has ' + open + ' open job(s). Reassign them after deactivating. The technician will not be able to log in.' : 'The technician will not be able to log in. Records are kept.') : 'The technician can log in again.';
  if (!(await confirmBox({ title: (u.active ? 'Deactivate ' : 'Activate ') + u.name + '?', body: body, ok: u.active ? 'Deactivate' : 'Activate', danger: u.active }))) return;
  u.active = !u.active; persist(); toast(u.active ? 'Account activated' : 'Account deactivated'); render(true);
};

/* --- reports, backup --- */
A.copycsv = function () { copyText(csvOf(reportJobs()), 'Copied. Paste into Excel or Google Sheets.'); };
A.togglemask = function (el) { db.settings.maskUntilAccepted = el.checked; persist(); toast('Setting saved'); };
A.showbackup = function () { $('#bkbox').innerHTML = '<div class="field"><label for="bk-text">Backup text. Select all, copy and keep it safe.</label><textarea id="bk-text" readonly style="min-height:140px;font-family:var(--font-mono);font-size:.78rem"></textarea></div><button class="btn ghost" data-act="copybackup">' + icon('copy') + 'Copy backup</button>'; $('#bk-text').value = JSON.stringify(db); $('#bk-text').select(); };
A.copybackup = function () { copyText($('#bk-text').value, 'Backup copied'); };
A.restore = async function () {
  var t = val('rs-text'), d;
  try { d = JSON.parse(t); } catch (e) { return fail('rs-err', 'That is not a valid backup.'); }
  if (!d || !Array.isArray(d.users) || !Array.isArray(d.jobs) || !Array.isArray(d.parts)) return fail('rs-err', 'That backup is missing jobs, users or parts.');
  fail('rs-err', '');
  if (!(await confirmBox({ title: 'Replace all data?', body: 'Everything now in the app will be replaced by the backup (' + d.jobs.length + ' jobs).', ok: 'Restore', danger: true }))) return;
  db = d; persist(); if (!me()) { sess = null; saveSession(); } toast('Backup restored'); render();
};
A.cleardemo = async function () {
  if (!(await confirmBox({ title: 'Remove sample data?', body: 'Sample technicians and sample jobs will be deleted. This cannot be undone.', ok: 'Remove', danger: true }))) return;
  var ids = db.users.filter(function (u) { return u.demo; }).map(function (u) { return u.id; });
  db.jobs = db.jobs.filter(function (j) { return !j.demo; }); db.users = db.users.filter(function (u) { return !u.demo; }); db.ledger = db.ledger.filter(function (e) { return ids.indexOf(e.techId) < 0; });
  persist(); toast('Sample data removed'); render(true);
};
A.resetall = async function () {
  if (!(await confirmBox({ title: 'Erase everything?', body: 'All jobs, technicians, parts changes and settlements are deleted and the sample data returns.', ok: 'Erase all', danger: true }))) return;
  seed(); sess = null; saveSession(); persist(); ui = { view: 'home', params: {}, tab: 'home', stack: [] }; render();
};

/* ============ events ============ */
function onField(e) {
  var el = e.target, p = el.dataset && el.dataset.jf; if (!p) return;
  var j = curJob(); if (!j) return;
  var v = el.type === 'checkbox' ? el.checked : el.value;
  setPath(j, p, v); persistSoon();
  if (p === 'report.collected' || p === 'poster') refreshJobCalc(j);
  if (p === 'photoConsent') { persist(); render(true); }
  if (p === 'report.followUp') { var n = $('#fuNote'); if (n) n.hidden = !v; }
}
document.addEventListener('click', function (e) {
  var o = $('#overlay');
  if (e.target === o && o.dataset.dismiss === '1') { closeSheet(); return; }
  var el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  var f = A[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset.jf) return onField(e);
  var s = el.dataset.search; if (!s) return;
  if (s === 'guide') $('#glist').innerHTML = guideListHTML(el.value);
  if (s === 'parts') { ui.params.q = el.value; $('#plist').innerHTML = partsListHTML(el.value, ui.params.g); }
  if (s === 'picker') $('#pp-list').innerHTML = partsListHTML(el.value, '', true);
  if (s === 'ajobs') { ui.params.q = el.value; var pos = el.selectionStart; render(true); var n = $('#jq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.jf) return onField(e);
  if (el.dataset.act === 'togglemask') return A.togglemask(el);
  if (el.classList.contains('sc')) { var all = $$('.sc').every(function (c) { return c.checked; }); var b = $('#scGo'); if (b) b.disabled = !all; return; }
  if (el.id === 'en-type') { $('#en-dirw').hidden = el.value !== 'adjustment'; return; }
  if (el.dataset.range) { ui.params[el.dataset.range] = el.value; ui.params.range = 'custom'; render(true); return; }
  if (el.dataset.rep) { ui.params[el.dataset.rep] = el.value; render(true); return; }
  if (el.dataset.pick === 'tech') { ui.params.tid = el.value; render(true); return; }
  if (el.dataset.photo) {
    var file = el.files && el.files[0]; if (!file) return;
    var kind = el.dataset.photo;
    readPhoto(file).then(function (url) {
      if (kind === 'part') { sheetPhoto = url; var im = $('#ep-prev'); im.src = url; im.hidden = false; return; }
      var j = curJob(); if (!j || !j.photoConsent) return;
      j.photos[kind].push(url);
      if (!persist()) j.photos[kind].pop();
      render(true);
    }).catch(function () { toast('Could not read that photo. Try again.', 'bad'); });
    el.value = '';
  }
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  var id = val('l-id').toUpperCase(), pin = val('l-pin'), u = db.users.filter(function (x) { return x.id.toUpperCase() === id; })[0];
  var err = $('#l-err');
  if (!u || u.pin !== pin) { err.textContent = 'ID or PIN is not correct.'; return; }
  if (!u.active) { err.textContent = 'This account is deactivated. Contact the administrator.'; return; }
  sess = { uid: u.id }; saveSession(); ui = { view: 'home', params: {}, tab: 'home', stack: [] }; render();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#overlay').dataset.dismiss === '1') closeSheet(); });
window.addEventListener('online', setSaveState); window.addEventListener('offline', setSaveState);

/* ============ start ============ */
loadSession(); load(); render();
window.__TL = { calcJob: calcJob, db: function () { return db; } };
})();
</script>
